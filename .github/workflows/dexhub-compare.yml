name: Dex Hub side-by-side screenshots

# Renders Dex Hub in Kodi (plugin + skin.dexhub from the latest add-on release) and this
# app on an Android TV emulator, then commits the screenshots to the ci-screens branch.
# Runs when .github/compare/run changes on a claude/* branch, or by hand.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/compare/run']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dexhub-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kodi:
    name: Dex Hub in Kodi 22
    runs-on: ubuntu-24.04
    steps:
      - name: Install Kodi 22 (Flathub beta) and tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq flatpak xvfb xdotool imagemagick sqlite3 unzip
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          # Kodi 22 (Piers) is on Flathub's beta channel; fall back to 21 if it is not there.
          flatpak remote-ls --user flathub-beta --app | grep -i kodi || true
          if flatpak install --user -y --noninteractive flathub-beta tv.kodi.Kodi//beta; then
            echo "KODI_REF=tv.kodi.Kodi//beta" >> "$GITHUB_ENV"
          else
            echo "::warning::Kodi 22 not on flathub-beta, using Kodi 21"
            flatpak install --user -y --noninteractive flathub tv.kodi.Kodi
            echo "KODI_REF=tv.kodi.Kodi" >> "$GITHUB_ENV"
          fi
          flatpak list --user --app

      - name: Download Dex Hub and skin.dexhub from the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download --repo 6ahd/plugin.video.dexhub --pattern 'plugin.video.dexhub-*.zip' --dir dl
          # A release that leaves the skin unchanged ships no skin zip: take the newest one that has it.
          tag=$(gh api 'repos/6ahd/plugin.video.dexhub/releases?per_page=30' \
            --jq '[.[] | select(any(.assets[]; .name | startswith("skin.dexhub-")))][0].tag_name')
          echo "skin from $tag"
          gh release download "$tag" --repo 6ahd/plugin.video.dexhub --pattern 'skin.dexhub-*.zip' --dir dl
          ls dl

      - name: First runs, install the add-ons where this Kodi keeps them, enable them
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          (DISPLAY=:99 timeout 60 flatpak run "$KODI_REF" --standalone --audio-backend=alsa || true)
          # Kodi 21 and 22 keep their data in different places inside the Flatpak: find it.
          db=$(find ~/.var/app/tv.kodi.Kodi -name 'Addons*.db' | head -1)
          echo "addons db: $db"
          kdata=$(dirname "$(dirname "$(dirname "$db")")")
          echo "KDATA=$kdata" >> "$GITHUB_ENV"
          echo "kodi data: $kdata"; ls "$kdata"
          grep -m1 "Starting Kodi" "$kdata/temp/kodi.log" || true
          for z in dl/*.zip; do unzip -q -o "$z" -d "$kdata/addons"; done
          echo '<advancedsettings><loglevel>0</loglevel></advancedsettings>' > "$kdata/userdata/advancedsettings.xml"
          (DISPLAY=:99 timeout 60 flatpak run "$KODI_REF" --standalone --audio-backend=alsa || true)
          sqlite3 "$db" "update installed set enabled=1 where addonID in ('skin.dexhub','plugin.video.dexhub');"
          sqlite3 "$db" "select addonID,enabled from installed where addonID like '%dexhub%';"
          # Start on skin.dexhub: switched at runtime, Kodi asks to keep it and Dex Hub's first-run
          # start-up closes that question, so Kodi reverts. Named before start-up, there is no question.
          printf '<settings version="2">\n    <setting id="lookandfeel.skin">skin.dexhub</setting>\n</settings>\n' > "$kdata/userdata/guisettings.xml"

      - name: Screenshots
        run: |
          mkdir -p shots/kodi
          (DISPLAY=:99 flatpak run "$KODI_REF" --standalone --audio-backend=alsa > kodi.out 2>&1 &)
          shot() { sleep "$2"; DISPLAY=:99 import -window root "shots/kodi/$1.png" || true; }
          key() { DISPLAY=:99 xdotool key "$1"; }
          rpc() { python3 -c 'import json,socket,sys
          s=socket.create_connection(("127.0.0.1",9090),10); s.sendall(sys.argv[1].encode()); s.settimeout(5)
          try: print(s.recv(65536).decode()[:300])
          except Exception as e: print(e)' "$1" || true; }
          shot 00-start 40
          rpc '{"jsonrpc":"2.0","id":2,"method":"Settings.GetSettingValue","params":{"setting":"lookandfeel.skin"}}'
          rpc '{"jsonrpc":"2.0","id":4,"method":"Settings.GetSettingValue","params":{"setting":"lookandfeel.skin"}}'
          shot 01-setup 40
          # Dex Hub's first run shows the phone setup page: Back continues on the TV.
          key BackSpace; shot 01b-after-setup 20
          key BackSpace; shot 01-home 30
          key Down; shot 02-home-down 4
          key Down; shot 03-home-row 4
          key Down; shot 04-home-row2 4
          key Up; key Up; key Up; key Up; shot 05-bar 4
          key Right; shot 06-bar-movies 6
          key Return; shot 07-select 6
          cp "$KDATA"/temp/kodi.log shots/kodi/kodi.log || cp ~/.var/app/tv.kodi.Kodi/data/temp/kodi.log shots/kodi/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: kodi-shots
          path: shots/kodi

  android:
    name: Dex Hub TV on an Android TV emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build the debug APK with an x86_64 split
        run: |
          touch local.properties local.dev.properties
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          export NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/ci.jks" NUVIO_RELEASE_KEY_ALIAS=androiddebugkey \
            NUVIO_RELEASE_KEY_PASSWORD=android NUVIO_RELEASE_STORE_PASSWORD=android
          ./gradlew :app:assembleFullDebug -PdexEmulatorAbi=true
          ls app/build/outputs/apk/full/debug/
          ./gradlew --stop  # free the runner's memory for the emulator

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator and take screenshots
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          ram-size: 3072M
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          script: bash .github/compare/android-shots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: shots/android

  publish:
    name: Commit the screenshots to ci-screens
    needs: [kodi, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shots
      - name: Push
        run: |
          mkdir -p shots && cd shots
          git init -q -b ci-screens
          git config user.name "dexhub-ci"
          git config user.email "dexhub-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
